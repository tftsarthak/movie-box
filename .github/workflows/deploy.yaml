name: CI/CD Pipeline - Build & Deploy to EC2

on:
  push:
    branches:
      - main # Triggers automatically on push to main branch
  
  workflow_dispatch: # Allows manual trigger from GitHub UI if needed

# Prevents simultaneous deployments from racing on EC2
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy to EC2
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://ankajgoyal.com

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (for layer caching and high performance)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build Monolithic Docker Image (React dist + Node Backend) and Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/movie-box:latest
            ${{ vars.DOCKERHUB_USERNAME }}/movie-box:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
            VITE_COGNITO_USER_POOL_ID=${{ secrets.VITE_COGNITO_USER_POOL_ID }}
            VITE_COGNITO_CLIENT_ID=${{ secrets.VITE_COGNITO_CLIENT_ID }}
            VITE_COGNITO_AUTHORITY=${{ secrets.VITE_COGNITO_AUTHORITY }}
            VITE_COGNITO_DOMAIN=${{ secrets.VITE_COGNITO_DOMAIN }}

      # Step 5: SSH into EC2 and restart the service via Docker Compose
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true # Immediately stop and fail the workflow if any SSH command fails
          script: |
            # Navigate to the directory containing docker-compose.yaml and .env
            cd ${{ vars.EC2_APP_DIR || '/home/ubuntu/app' }}

            # Pull the latest image from Docker Hub
            docker compose pull

            # Recreate containers with minimal downtime using latest image
            docker compose up -d --remove-orphans

            # Clean up old unused images to keep EC2 disk healthy
            docker image prune -f
